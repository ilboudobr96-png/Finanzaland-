<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FinanzaLand — Mondo degli Allevatori</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800&display=swap');
:root{--gold:#F5C842;--bg:#0F0A2E;--card:#1A1040;--purple:#4A2FA0;--purple2:#2D1B69;--green:#27AE60;--red:#E74C3C;--blue:#2980B9;}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);font-family:'Nunito',sans-serif;color:#fff;min-height:100vh;padding:0 0 80px;}

/* HEADER */
.header{background:linear-gradient(135deg,#1A1040,#2D1B69);padding:16px 16px 14px;text-align:center;border-bottom:2px solid var(--purple);position:sticky;top:0;z-index:100;}
.header h1{font-family:'Fredoka One',cursive;color:var(--gold);font-size:1.5rem;text-shadow:0 2px 10px rgba(245,200,66,0.4);}
.semi-bar{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:5px;}
.semi-count{background:var(--purple2);color:var(--gold);font-family:'Fredoka One',cursive;font-size:0.95rem;padding:3px 14px;border-radius:20px;}

/* LEVEL + DRAGON STAGE */
.level-bar{display:flex;align-items:center;justify-content:center;gap:8px;padding:12px 16px 0;font-size:0.8rem;flex-wrap:wrap;}
.level-bar label{color:var(--gold);font-weight:800;}
.level-bar input{accent-color:var(--gold);width:130px;}
.level-val{background:var(--purple);color:var(--gold);font-family:'Fredoka One',cursive;padding:2px 12px;border-radius:16px;}
.dragon-stage-badge{background:linear-gradient(135deg,#2D1B69,#4A2FA0);border:1px solid var(--gold);border-radius:12px;padding:3px 12px;font-size:0.72rem;font-weight:800;color:var(--gold);}

/* SECTION */
.section-title{font-family:'Fredoka One',cursive;color:var(--gold);font-size:1rem;padding:16px 16px 8px;}

/* AVATAR SCROLL */
.avatar-scroll{display:flex;gap:10px;padding:4px 16px 14px;overflow-x:auto;scrollbar-width:none;}
.avatar-scroll::-webkit-scrollbar{display:none;}
.av-chip{flex-shrink:0;background:var(--card);border:2px solid var(--purple);border-radius:14px;padding:8px 10px;text-align:center;cursor:pointer;transition:all 0.2s;min-width:74px;position:relative;}
.av-chip.active{border-color:var(--gold);background:var(--purple2);box-shadow:0 0 14px rgba(245,200,66,0.3);}
.av-chip.locked-chip{filter:grayscale(0.8) brightness(0.45);cursor:not-allowed;}
.av-chip svg{width:52px;height:52px;}
.chip-name{font-family:'Fredoka One',cursive;font-size:0.7rem;color:var(--gold);margin-top:3px;}
.chip-flag{font-size:0.9rem;margin-bottom:1px;}
.chip-badge{position:absolute;top:-6px;right:-6px;background:var(--gold);color:#1A1040;font-size:0.45rem;font-weight:800;padding:1px 5px;border-radius:8px;}
.chip-lock{position:absolute;top:-6px;left:-6px;background:var(--purple2);color:#aaa;font-size:0.5rem;font-weight:800;padding:1px 4px;border-radius:6px;}
.chip-gender{position:absolute;bottom:28px;right:3px;font-size:0.65rem;}

/* CULTURE CARD */
.culture-card{margin:0 16px 20px;background:var(--card);border:2px solid var(--purple);border-radius:20px;overflow:hidden;animation:fadeIn 0.3s ease;}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.culture-header{padding:16px 16px 12px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--purple);}
.culture-header svg{width:68px;height:68px;flex-shrink:0;}
.culture-header .info h2{font-family:'Fredoka One',cursive;color:var(--gold);font-size:1.1rem;}
.culture-header .info .country{font-size:0.72rem;color:#a89fd8;margin:2px 0 4px;}
.culture-header .info .bio{font-size:0.72rem;color:#c0b8e8;line-height:1.5;}
.dragon-evo{display:flex;gap:4px;margin-top:6px;flex-wrap:wrap;}
.evo-pill{background:var(--purple2);border:1px solid var(--purple);border-radius:8px;padding:2px 7px;font-size:0.6rem;font-weight:800;}
.evo-pill.active-evo{border-color:var(--gold);color:var(--gold);}

/* TABS */
.learn-tabs{display:flex;border-bottom:1px solid var(--purple);}
.learn-tab{flex:1;text-align:center;padding:9px 4px;font-size:0.68rem;font-weight:800;color:#7760aa;cursor:pointer;transition:all 0.2s;border-bottom:2px solid transparent;}
.learn-tab.active{color:var(--gold);border-bottom-color:var(--gold);background:rgba(245,200,66,0.05);}

/* TAB CONTENT */
.tab-content{display:none;padding:14px;}
.tab-content.active{display:block;}
.info-block{background:var(--purple2);border-radius:12px;padding:12px;margin-bottom:10px;}
.info-block h3{font-family:'Fredoka One',cursive;color:var(--gold);font-size:0.85rem;margin-bottom:6px;}
.info-block p{font-size:0.75rem;color:#c0b8e8;line-height:1.6;}
.tag-row{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px;}
.tag{background:var(--purple);color:#e0d8ff;font-size:0.6rem;font-weight:700;padding:2px 8px;border-radius:8px;}

/* LINGUA */
.phrase-list{display:flex;flex-direction:column;gap:7px;}
.phrase-item{display:flex;align-items:center;justify-content:space-between;background:var(--purple2);border-radius:10px;padding:9px 12px;}
.phrase-it{font-size:0.7rem;color:#a89fd8;}
.phrase-local{font-family:'Fredoka One',cursive;font-size:0.88rem;color:var(--gold);}
.phrase-phonetic{font-size:0.58rem;color:#7760aa;display:block;margin-top:1px;}
.play-btn{background:var(--purple);border:none;cursor:pointer;border-radius:50%;width:26px;height:26px;font-size:0.75rem;color:#fff;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:background 0.2s;}
.play-btn:hover{background:var(--gold);color:#1A1040;}

/* QUIZ */
.quiz-box{background:var(--purple2);border-radius:14px;padding:14px;}
.quiz-progress{font-size:0.68rem;color:#7760aa;margin-bottom:8px;font-weight:800;}
.quiz-question{font-family:'Fredoka One',cursive;font-size:0.95rem;color:#fff;margin-bottom:12px;line-height:1.4;}
.quiz-options{display:flex;flex-direction:column;gap:7px;}
.quiz-option{background:var(--card);border:2px solid var(--purple);border-radius:10px;padding:9px 12px;font-size:0.78rem;color:#e0d8ff;cursor:pointer;transition:all 0.2s;font-weight:700;}
.quiz-option:hover:not(.disabled){border-color:var(--gold);color:var(--gold);}
.quiz-option.correct{border-color:var(--green);background:rgba(39,174,96,0.2);color:#6be06b;}
.quiz-option.wrong{border-color:var(--red);background:rgba(231,76,60,0.2);color:#ff8a80;}
.quiz-option.disabled{pointer-events:none;}
.quiz-result{display:none;text-align:center;margin-top:12px;padding:10px;border-radius:10px;font-weight:800;font-size:0.8rem;}
.quiz-result.show{display:block;}
.quiz-result.correct-r{background:rgba(39,174,96,0.2);color:#6be06b;}
.quiz-result.wrong-r{background:rgba(231,76,60,0.2);color:#ff8a80;}
.next-btn{display:none;width:100%;margin-top:10px;background:var(--gold);color:#1A1040;font-family:'Fredoka One',cursive;font-size:0.9rem;border:none;padding:9px;border-radius:10px;cursor:pointer;}
.next-btn.show{display:block;}
.quiz-complete{text-align:center;padding:24px 16px;}
.quiz-complete .big{font-size:2rem;margin-bottom:8px;}
.quiz-complete h3{font-family:'Fredoka One',cursive;color:var(--gold);font-size:1.1rem;margin-bottom:4px;}
.quiz-complete p{font-size:0.75rem;color:#a89fd8;}
.reset-quiz-btn{margin-top:12px;background:var(--purple);color:#fff;font-family:'Fredoka One',cursive;font-size:0.85rem;border:none;padding:8px 20px;border-radius:10px;cursor:pointer;}

/* MISSIONI */
.mission-list{display:flex;flex-direction:column;gap:9px;}
.mission-item{display:flex;align-items:center;gap:10px;background:var(--purple2);border-radius:12px;padding:11px 12px;border:1px solid var(--purple);transition:border-color 0.2s;}
.mission-item.completed{border-color:var(--green);}
.mission-icon{font-size:1.5rem;flex-shrink:0;}
.mission-info{flex:1;}
.m-title{font-family:'Fredoka One',cursive;font-size:0.84rem;color:#fff;}
.m-desc{font-size:0.65rem;color:#a89fd8;margin-top:2px;line-height:1.4;}
.m-reward{font-size:0.62rem;color:var(--gold);font-weight:800;margin-top:3px;}
.mission-btn{background:var(--purple);color:#fff;font-family:'Fredoka One',cursive;font-size:0.68rem;border:none;padding:6px 11px;border-radius:8px;cursor:pointer;flex-shrink:0;transition:background 0.2s;}
.mission-btn:hover{background:var(--gold);color:#1A1040;}
.mission-btn.done{background:var(--green);cursor:default;}

/* SAGGEZZA */
.wisdom-box{background:var(--purple2);border-radius:16px;padding:16px;margin-bottom:12px;}
.wisdom-quote{font-family:'Fredoka One',cursive;font-size:1.05rem;color:var(--gold);line-height:1.5;margin-bottom:8px;}
.wisdom-sub{font-size:0.75rem;color:#a89fd8;line-height:1.6;margin-bottom:14px;}
.wisdom-prompt{font-size:0.8rem;font-weight:800;color:#e0d8ff;margin-bottom:8px;}
.wisdom-textarea{width:100%;background:var(--card);border:2px solid var(--purple);border-radius:12px;padding:10px 12px;color:#fff;font-family:'Nunito',sans-serif;font-size:0.82rem;resize:none;min-height:90px;outline:none;transition:border-color 0.2s;}
.wisdom-textarea:focus{border-color:var(--gold);}
.wisdom-send-btn{width:100%;margin-top:10px;background:var(--gold);color:#1A1040;font-family:'Fredoka One',cursive;font-size:0.95rem;border:none;padding:10px;border-radius:12px;cursor:pointer;transition:opacity 0.2s;}
.wisdom-send-btn:hover{opacity:0.85;}
.wisdom-send-btn:disabled{opacity:0.5;cursor:not-allowed;}
.civetta-reply{display:none;margin-top:14px;background:var(--card);border:2px solid var(--gold);border-radius:14px;padding:14px;}
.civetta-reply.show{display:block;animation:fadeIn 0.3s ease;}
.civetta-header{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
.civetta-header .cname{font-family:'Fredoka One',cursive;color:var(--gold);font-size:0.85rem;}
.civetta-header .badge{font-size:0.6rem;color:#a89fd8;background:var(--purple2);padding:2px 8px;border-radius:8px;}
.civetta-text{font-size:0.78rem;color:#e0d8ff;line-height:1.7;}
.wisdom-reward{margin-top:10px;text-align:center;font-family:'Fredoka One',cursive;font-size:0.9rem;color:var(--green);}
.civetta-loading{font-size:0.75rem;color:#a89fd8;text-align:center;padding:10px;display:none;}
.civetta-loading.show{display:block;}

/* ADULT MODE TOGGLE */
.mode-bar {
  display:flex; align-items:center; justify-content:center;
  gap:0; margin:12px 16px 0; border-radius:14px; overflow:hidden;
  border:2px solid var(--purple);
}
.mode-btn {
  flex:1; text-align:center; padding:9px 4px;
  font-family:'Fredoka One',cursive; font-size:0.85rem;
  cursor:pointer; transition:all 0.2s; color:#7760aa;
  background:var(--card);
}
.mode-btn.active { background:var(--purple); color:var(--gold); }
.mode-btn:first-child { border-right:1px solid var(--purple); }

/* ADULT BADGE */
.adult-badge {
  display:inline-block; background:linear-gradient(135deg,#F5C842,#E67E22);
  color:#1A1040; font-size:0.55rem; font-weight:800;
  padding:2px 6px; border-radius:8px; margin-left:4px;
  vertical-align:middle; text-transform:uppercase;
}

/* ADULT CONTENT */
.adult-block {
  background:linear-gradient(135deg,#1A1040,#2D1B69);
  border:1px solid var(--gold); border-radius:12px;
  padding:13px; margin-bottom:11px;
}
.adult-block h3 {
  font-family:'Fredoka One',cursive; color:var(--gold);
  font-size:0.88rem; margin-bottom:6px;
  display:flex; align-items:center; gap:6px;
}
.adult-block p { font-size:0.76rem; color:#c0b8e8; line-height:1.65; }
.adult-block .deep-tag {
  display:inline-block; background:rgba(245,200,66,0.15);
  border:1px solid var(--gold); color:var(--gold);
  font-size:0.6rem; font-weight:800;
  padding:2px 8px; border-radius:8px; margin-top:7px; margin-right:4px;
}

/* INVESTMENT TABLE */
.inv-table { width:100%; border-collapse:collapse; margin-top:10px; }
.inv-table th {
  background:var(--purple); color:var(--gold);
  font-family:'Fredoka One',cursive; font-size:0.72rem;
  padding:6px 8px; text-align:left;
}
.inv-table td {
  font-size:0.7rem; color:#c0b8e8; padding:5px 8px;
  border-bottom:1px solid var(--purple);
}
.inv-table tr:last-child td { border-bottom:none; }
.inv-table .pos { color:#6be06b; font-weight:800; }
.inv-table .neg { color:#ff8a80; font-weight:800; }

/* FAMILY LINK BOX */
.family-link {
  background:var(--purple2); border:2px solid var(--green);
  border-radius:14px; padding:14px; margin-bottom:12px;
  display:flex; align-items:center; gap:12px;
}
.family-link .fl-icon { font-size:2rem; flex-shrink:0; }
.family-link h3 { font-family:'Fredoka One',cursive; color:var(--green); font-size:0.9rem; margin-bottom:3px; }
.family-link p { font-size:0.72rem; color:#c0b8e8; line-height:1.5; }

/* TOAST */
.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);background:var(--green);color:#fff;font-weight:800;font-size:0.82rem;padding:9px 22px;border-radius:18px;opacity:0;transition:opacity 0.3s;pointer-events:none;z-index:999;white-space:nowrap;}
.toast.show{opacity:1;}
</style>
</head>

function adj(hex, amt) {
  try {
    const r = Math.max(0, Math.min(255, parseInt(hex.slice(1,3),16)+amt));
    const g = Math.max(0, Math.min(255, parseInt(hex.slice(3,5),16)+amt));
    const b = Math.max(0, Math.min(255, parseInt(hex.slice(5,7),16)+amt));
    return '#'+[r,g,b].map(x=>x.toString(16).padStart(2,'0')).join('');
  } catch(e){ return hex; }
}

function buildSVG(av, forChip=false) {
  const s=av.skin, h=av.hair, d=av.dragon;
  const iF = av.gender==='f';
  const hairFn = iF ? (HAIR_F[av.id]||HAIR_F.default_f) : (HAIR_M[av.id]||HAIR_M.default_m);
  const hs = hairFn(h);

  // Eye colors
  const eyeC = {giulia:'#2980B9',mei:'#1A0A00',priya:'#3D1C02'};
  const ec = eyeC[av.id]||'#1A0A00';

  // Dragon stage scaling
  const stage = getDragonStage(currentLevel);
  const scale = getDragonScale(stage.stage);
  const dOffX = forChip ? 0 : (scale-1)*5;
  const dR1 = 11*scale, dR2 = 8*scale, dRH = 6.5*scale;

  // Female extras
  const cheeks = iF ? `<ellipse cx="37" cy="57" rx="5" ry="3" fill="#FFB6C1" opacity="0.5"/><ellipse cx="63" cy="57" rx="5" ry="3" fill="#FFB6C1" opacity="0.5"/>` : '';
  const lashes = iF ? `<path d="M39 48 L37 45 M41.5 47 L40 44 M44 47.5 L43.5 44.5" stroke="${ec}" stroke-width="0.8" fill="none"/><path d="M53 48 L51 45 M55.5 47 L54 44 M58 47.5 L57.5 44.5" stroke="${ec}" stroke-width="0.8" fill="none"/>` : '';
  const earrings = iF ? `<circle cx="25" cy="53" r="2" fill="${d}"/><circle cx="75" cy="53" r="2" fill="${d}"/>` : '';

  // Dragon crown for legendary
  const dragonCrown = (!forChip && stage.stage>=3) ? `<polygon points="77,54 74,49 77,52 80,49 77,54" fill="${adj(d,30)}"/>` : '';
  const dragonHalo  = (!forChip && stage.stage===4) ? `<circle cx="${77}" cy="${64}" r="${6.5*1.85+4}" fill="none" stroke="${adj(d,40)}" stroke-width="1.5" opacity="0.5"/>` : '';

  return `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
    <circle cx="50" cy="50" r="48" fill="#1a1040"/>
    <ellipse cx="50" cy="80" rx="22" ry="15" fill="${adj(s,-20)}"/>
    <rect x="44" y="61" width="12" height="9" rx="3" fill="${s}"/>
    <circle cx="50" cy="51" r="21" fill="${s}"/>
    <ellipse cx="29" cy="51" rx="4" ry="5" fill="${s}"/>
    <ellipse cx="71" cy="51" rx="4" ry="5" fill="${s}"/>
    ${earrings}
    ${hs}
    ${lashes}
    <ellipse cx="43" cy="51" rx="3.8" ry="4.2" fill="#fff"/>
    <ellipse cx="57" cy="51" rx="3.8" ry="4.2" fill="#fff"/>
    <circle cx="44" cy="52" r="2.3" fill="${ec}"/>
    <circle cx="58" cy="52" r="2.3" fill="${ec}"/>
    <circle cx="44.8" cy="51.3" r="0.7" fill="#fff"/>
    <circle cx="58.8" cy="51.3" r="0.7" fill="#fff"/>
    ${cheeks}
    <ellipse cx="50" cy="57" rx="2.2" ry="1.6" fill="${adj(s,-25)}"/>
    <path d="M43 63 Q50 68 57 63" stroke="${adj(s,-30)}" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <path d="M46 63.5 Q50 67 54 63.5" fill="#fff"/>
    <ellipse cx="${77+dOffX}" cy="73" rx="${dR1}" ry="${dR2}" fill="${d}"/>
    <circle cx="${77+dOffX}" cy="${64-dOffX*0.3}" r="${dRH}" fill="${d}"/>
    <circle cx="${74.5+dOffX}" cy="${62-dOffX*0.3}" r="1.4" fill="#1A0A00"/>
    <circle cx="${79.5+dOffX}" cy="${62-dOffX*0.3}" r="1.4" fill="#1A0A00"/>
    <polygon points="${73+dOffX},${60-dOffX*0.3} ${71+dOffX},${55-dOffX*0.3} ${75+dOffX},${58-dOffX*0.3}" fill="${adj(d,-20)}"/>
    <polygon points="${81+dOffX},${60-dOffX*0.3} ${83+dOffX},${55-dOffX*0.3} ${79+dOffX},${58-dOffX*0.3}" fill="${adj(d,-20)}"/>
    ${dragonCrown}
    ${dragonHalo}
    <path d="M${74.5+dOffX} ${65.5-dOffX*0.3} Q${77+dOffX} ${67-dOffX*0.3} ${79.5+dOffX} ${65.5-dOffX*0.3}" stroke="${adj(d,-30)}" stroke-width="1" fill="none"/>
  </svg>`;
}

// RENDER SCROLL
// ═══════════════════════════════════════════════════════
function renderScroll() {
  if(adultMode) { renderAdultScroll(); return; }
  const el = document.getElementById('avatarScroll');
  el.innerHTML = '';
  AVATARS.forEach(av => {
    const unlocked = currentLevel >= av.unlockLv;
    const isActive = selectedAv.id === av.id;
    const div = document.createElement('div');
    div.className = `av-chip${unlocked?' ':'  locked-chip'}${isActive?' active':''}`;
    div.innerHTML = `
      ${av.starter?`<span class="chip-badge">⭐</span>`:''}
      ${!unlocked?`<span class="chip-lock">Lv${av.unlockLv}</span>`:''}
      <span class="chip-gender">${av.gender==='m'?'♂':'♀'}</span>
      <div class="chip-flag">${av.flag}</div>
      ${buildSVG(av, true)}
      <div class="chip-name">${av.name}</div>
    `;
    if(unlocked) div.onclick = () => {
      selectedAv = av;
      activeTab = 'cultura';
      document.getElementById('learnName').textContent = av.name;
      renderCultureCard();
      renderScroll();
    };
    el.appendChild(div);
  });
}

// QUIZ — FIX: progress per avatar, non si resetta
// ═══════════════════════════════════════════════════════
function renderQuizHTML(av) {
  const qp = getQP(av.id);
  const q = av.quiz[qp.currentQ];

  if(!q) return `<div class="quiz-complete">
    <div class="big">🎉</div>
    <h3>Tutti i quiz completati!</h3>
    <p>Hai risposto a tutte le domande di ${av.name}!</p>
    <button class="reset-quiz-btn" onclick="resetQuiz('${av.id}')">🔄 Rigioca</button>
  </div>`;

  return `<div class="quiz-box">
    <div class="quiz-progress">Domanda ${qp.currentQ+1} di ${av.quiz.length} · 🌱 +${q.reward} Semi</div>
    <div class="quiz-question">${q.q}</div>
    <div class="quiz-options">
      ${q.opts.map((opt,i)=>`
        <div class="quiz-option${qp.answered?' disabled':''}" id="qopt_${av.id}_${i}"
          onclick="answerQuiz('${av.id}',${i},${q.correct},${q.reward})">
          ${String.fromCharCode(65+i)}. ${opt}
        </div>`).join('')}
    </div>
    <div class="quiz-result${qp.answered?' show':''}" id="quizResult_${av.id}"></div>
    <button class="next-btn${qp.answered?' show':''}" onclick="nextQuestion('${av.id}')">Prossima domanda →</button>
  </div>`;
}

function answerQuiz(avId, selected, correct, reward) {
  const qp = getQP(avId);
  if(qp.answered) return;
  qp.answered = true;

  const av = AVATARS.find(a=>a.id===avId);
  const q = av.quiz[qp.currentQ];

  // Colora opzioni
  av.quiz[qp.currentQ].opts.forEach((_,i) => {
    const el = document.getElementById(`qopt_${avId}_${i}`);
    if(!el) return;
    el.classList.add('disabled');
    if(i===correct) el.classList.add('correct');
    else if(i===selected) el.classList.add('wrong');
  });

  const result = document.getElementById(`quizResult_${avId}`);
  const nextBtn = result?.nextElementSibling;

  if(selected===correct) {
    semiDiLuce += reward;
    updateSemi();
    if(result) { result.textContent=`✓ Corretto! +${reward} Semi di Luce 🌱`; result.className='quiz-result show correct-r'; }
    showToast(`+${reward} Semi di Luce! 🌱`);
  } else {
    if(result) { result.textContent=`✗ Non esatto. Risposta: ${q.opts[correct]}`; result.className='quiz-result show wrong-r'; }
  }
  if(nextBtn) nextBtn.classList.add('show');
}

function nextQuestion(avId) {
  const qp = getQP(avId);
  qp.currentQ++;
  qp.answered = false;
  // FIX: solo re-render del quiz tab, non tutta la card
  const tab = document.querySelector('.tab-content.active');
  if(tab) tab.innerHTML = renderQuizHTML(AVATARS.find(a=>a.id===avId));
}

function resetQuiz(avId) {
  quizProgress[avId] = {currentQ:0, answered:false};
  const tab = document.querySelector('.tab-content.active');
  if(tab) tab.innerHTML = renderQuizHTML(AVATARS.find(a=>a.id===avId));
}

// MISSIONI — FIX: non resetta quiz
// ═══════════════════════════════════════════════════════
function renderMissionsHTML(av) {
  return `<div class="mission-list">${av.missioni.map((m,i) => {
    const key = av.id+'_'+i;
    const done = !!missionsDone[key];
    return `<div class="mission-item${done?' completed':''}">
      <div class="mission-icon">${m.icon}</div>
      <div class="mission-info">
        <div class="m-title">${m.title}</div>
        <div class="m-desc">${m.desc}</div>
        <div class="m-reward">🌱 +${m.reward} Semi di Luce</div>
      </div>
      <button class="mission-btn${done?' done':''}" onclick="${done?'':  `completeMission('${av.id}',${i},${m.reward})`}">${done?'✓':'Vai!'}</button>
    </div>`;
  }).join('')}</div>`;
}

// FIX BUG: solo re-render missioni, senza toccare quiz
function completeMission(avId, idx, reward) {
  const key = avId+'_'+idx;
  if(missionsDone[key]) return;
  missionsDone[key] = true;
  semiDiLuce += reward;
  updateSemi();
  showToast(`Missione completata! +${reward} Semi 🌱`);
  // Re-render SOLO la lista missioni
  const tab = document.querySelector('.tab-content.active');
  if(tab) tab.innerHTML = renderMissionsHTML(AVATARS.find(a=>a.id===avId));
}

// UTILS
// ═══════════════════════════════════════════════════════
function switchTab(tab) {
  activeTab = tab;
  renderCultureCard();
}

function playPhrase(text) {
  if('speechSynthesis' in window) {
    window.speechSynthesis.cancel();
    const utt = new SpeechSynthesisUtterance(text);
    utt.lang = 'it-IT'; utt.rate = 0.85;
    window.speechSynthesis.speak(utt);
  }
  showToast(`🔊 "${text}"`);
}

function updateSemi() {
  document.getElementById('semiCount').textContent = semiDiLuce+' Semi di Luce';
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(()=>t.classList.remove('show'), 2500);
}

function updateDragonBadge() {
  const stage = getDragonStage(currentLevel);
  document.getElementById('stageBadge').textContent = stage.name;
}

document.getElementById('lvSlider').addEventListener('input', function() {
  currentLevel = parseInt(this.value);
  document.getElementById('lvVal').textContent = currentLevel;
  if(currentLevel < selectedAv.unlockLv) {
    selectedAv = AVATARS[0];
    document.getElementById('learnName').textContent = AVATARS[0].name;
  }
  updateDragonBadge();
  renderScroll();
  renderCultureCard();
});

// Stato saggezza per avatar
let wisdomState = {}; // { avId: { replied: false, rewardGiven: false } }
function getWS(id) {
  if(!wisdomState[id]) wisdomState[id] = { replied: false, rewardGiven: false };
  return wisdomState[id];
}

function renderWisdomHTML(av) {
  const w = WISDOM[av.id];
  if(!w) return `<div style="text-align:center;padding:24px;color:#7760aa">Saggezza in arrivo presto...</div>`;
  const ws = getWS(av.id);
  return `
    <div class="wisdom-box">
      <div style="font-size:2rem;text-align:center;margin-bottom:10px">${w.icon}</div>
      <div class="wisdom-quote">${w.quote}</div>
      <div style="font-size:0.62rem;color:#7760aa;margin-bottom:10px;font-style:italic">— ${w.origine}</div>
      <div class="wisdom-sub">${w.lezione}</div>
      <div class="wisdom-prompt">🤔 ${w.domanda}</div>
      <textarea class="wisdom-textarea" id="wisdom-input-${av.id}"
        placeholder="Scrivi qui la tua risposta... non ci sono risposte sbagliate!"
        ${ws.replied?'disabled':''}>${ws.replied?'':''}
      </textarea>
      <button class="wisdom-send-btn" id="wisdom-btn-${av.id}"
        onclick="sendWisdom('${av.id}')"
        ${ws.replied?'disabled':''}>
        ${ws.replied?'✓ Risposta inviata!':'🦉 Invia a Civetta →'}
      </button>
      <div class="civetta-loading" id="wisdom-loading-${av.id}">🦉 Civetta sta leggendo la tua risposta...</div>
      <div class="civetta-reply${ws.replied?' show':''}" id="wisdom-reply-${av.id}">
        <div class="civetta-header">
          <span>🦉</span>
          <span class="cname">Civetta AI</span>
          <span class="badge">Powered by Claude · Solo a scopo educativo</span>
        </div>
        <div class="civetta-text" id="wisdom-text-${av.id}">${ws.replied?ws.civettaText:''}</div>
        ${ws.rewardGiven?`<div class="wisdom-reward">+${w.reward} Semi di Luce guadagnati! 🌱</div>`:''}
      </div>
    </div>`;
}

async function sendWisdom(avId) {
  const av = AVATARS.find(a=>a.id===avId);
  const w = WISDOM[avId];
  const ws = getWS(avId);
  const input = document.getElementById('wisdom-input-'+avId);
  const btn = document.getElementById('wisdom-btn-'+avId);
  const loading = document.getElementById('wisdom-loading-'+avId);
  const replyBox = document.getElementById('wisdom-reply-'+avId);
  const replyText = document.getElementById('wisdom-text-'+avId);

  const risposta = input?.value?.trim();
  if(!risposta || risposta.length < 5) {
    showToast('Scrivi almeno una frase! 😊');
    return;
  }

  btn.disabled = true;
  btn.textContent = '⏳ Invio...';
  if(loading) loading.classList.add('show');

  const systemPrompt = `Sei Civetta, l'assistente educativa di FinanzaLand. 
Stai parlando con un bambino tra 6 e 16 anni.
L'avatar dell'utente è ${av.name} (${av.country}).
La saggezza mostrata era: "${w.quote}" — ${w.origine}.
La lezione era: ${w.lezione}
La domanda era: "${w.domanda}"

Rispondi in italiano, in modo caloroso, semplice e incoraggiante.
- Celebra la risposta del bambino (non c'è risposta sbagliata)
- Collega la sua risposta alla lezione sulla saggezza e ai soldi in modo semplice
- Aggiungi un fatto curioso sulla cultura di ${av.country}
- Termina con un incoraggiamento
- Massimo 4 frasi. Tono: amico saggio, non professore.`;

  try {
    const response = await fetch('/api/chat', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        system: systemPrompt,
        messages: [{role:'user', content:`La mia risposta: "${risposta}"`}]
      })
    });

    const data = await response.json();
    const text = data?.content?.[0]?.text || 'Che bella risposta! Continua a riflettere così — la saggezza è il tuo tesoro più grande! 🦉';

    ws.replied = true;
    ws.civettaText = text;
    ws.rewardGiven = true;

    if(loading) loading.classList.remove('show');
    if(replyBox) replyBox.classList.add('show');
    if(replyText) replyText.textContent = text;

    if(!ws.rewardGiven) {
      semiDiLuce += w.reward;
      updateSemi();
      showToast(`+${w.reward} Semi di Luce! Ottima riflessione! 🌱`);
    } else {
      semiDiLuce += w.reward;
      updateSemi();
      showToast(`+${w.reward} Semi di Luce! 🌱`);
    }

    btn.textContent = '✓ Risposta inviata!';
    input.disabled = true;

    // Aggiungi reward al DOM senza re-render (non tocca quiz)
    const rewardDiv = document.createElement('div');
    rewardDiv.className = 'wisdom-reward';
    rewardDiv.textContent = `+${w.reward} Semi di Luce guadagnati! 🌱`;
    replyBox.appendChild(rewardDiv);

  } catch(err) {
    if(loading) loading.classList.remove('show');
    btn.disabled = false;
    btn.textContent = '🦉 Invia a Civetta →';
    // Fallback offline
    ws.replied = true;
    ws.civettaText = `Che risposta meravigliosa! 🦉 Ogni grande viaggio inizia con una domanda coraggiosa come la tua. ${av.name} sarebbe fiero di te! Continua a riflettere — la saggezza è il tuo superpotere.`;
    ws.rewardGiven = true;
    if(replyBox) replyBox.classList.add('show');
    if(replyText) replyText.textContent = ws.civettaText;
    semiDiLuce += w.reward;
    updateSemi();
    showToast(`+${w.reward} Semi di Luce! 🌱`);
    input.disabled = true;
  }
}

function getAdultContent(avId) {
  const av = ADULTS.find(a=>a.id===avId);
  if(!av) return null;
  const map = {
    'kofi_p':'BF','marie_p':'BF',
    'elena_p':'IT','roberto_p':'IT',
    'ana_p':'BR','raj_p':'IN',
    'yuki_p':'JP','carlos_p':'AR',
  };
  return ADULT_CONTENT[map[avId]] || null;
}

function getAdultWS(id) {
  if(!adultWisdomState[id]) adultWisdomState[id]={replied:false,rewardGiven:false,civettaText:''};

function switchMode(mode) {
  adultMode = (mode==='adult');
  document.getElementById('modeChild').classList.toggle('active', !adultMode);
  document.getElementById('modeAdult').classList.toggle('active', adultMode);

  const secTitle = document.querySelector('.section-title');
  if(secTitle) secTitle.textContent = adultMode ? '👨‍👩‍👧 Scegli il tuo Avatar Genitore' : '🐉 Scegli il tuo Allevatore';
  document.getElementById('learnName').textContent = adultMode ? selectedAdult.name : selectedAv.name;

  renderScroll();
  renderCultureCard();
}

function renderAdultScroll() {
  const el = document.getElementById('avatarScroll');
  el.innerHTML = '';
  ADULTS.forEach(av => {
    const unlocked = currentLevel >= av.unlockLv;
    const isActive = selectedAdult.id === av.id;
    const div = document.createElement('div');
    div.className = `av-chip${unlocked?' ':'  locked-chip'}${isActive?' active':''}`;
    div.innerHTML = `
      ${!unlocked?`<span class="chip-lock">Lv${av.unlockLv}</span>`:''}
      <span class="chip-gender">${av.gender==='m'?'♂':'♀'}</span>
      <div class="chip-flag">${av.flag}</div>
      ${buildSVG(av, true)}
      <div class="chip-name">${av.name}</div>
    `;
    if(unlocked) div.onclick = () => {
      selectedAdult = av;
      adultTab = 'investimenti';
      document.getElementById('learnName').textContent = av.name;
      renderCultureCard();
      renderAdultScroll();
    };
    el.appendChild(div);
  });
}

async function sendAdultWisdom(avId, reward) {
  const av = ADULTS.find(a=>a.id===avId);
  const content = getAdultContent(avId);
  if(!content) return;
  const ws = getAdultWS(avId);
  const input = document.getElementById('adult-wisdom-'+avId);
  const btn = document.getElementById('adult-wisdom-btn-'+avId);
  const loading = document.getElementById('adult-loading-'+avId);
  const replyBox = document.getElementById('adult-reply-'+avId);
  const replyText = document.getElementById('adult-text-'+avId);

  const risposta = input?.value?.trim();
  if(!risposta || risposta.length<10) { showToast('Scrivi almeno una frase! 😊'); return; }

  btn.disabled=true; btn.textContent='⏳ Invio...';
  if(loading) loading.classList.add('show');

  const systemPrompt = `Sei Civetta, assistente educativa di FinanzaLand — Modalità Genitore.
Stai parlando con un adulto/genitore, avatar ${av.name} (${av.country}, ruolo: ${av.role}).
La domanda filosofica era: "${content.filosofia.domanda}"
Rispondi in italiano, tono rispettoso e profondo — non infantile.
- Valida la riflessione dell'adulto con intelligenza
- Collega alla finanza familiare e all'educazione dei figli
- Aggiungi una prospettiva culturale di ${av.country}
- Suggerisci come tradurre questa riflessione in un'azione concreta con i figli
- Max 4 frasi. Tono: collega adulto, non professore.`;

  try {
    const response = await fetch('/api/chat', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({system:systemPrompt, messages:[{role:'user',content:`La mia riflessione: "${risposta}"`}]})
    });
    const data = await response.json();
    const text = data?.content?.[0]?.text || 'Riflessione profonda. La consapevolezza che stai sviluppando è già un patrimonio che stai trasmettendo ai tuoi figli. 🦉';

    ws.replied=true; ws.civettaText=text; ws.rewardGiven=true;
    if(loading) loading.classList.remove('show');
    if(replyBox) replyBox.classList.add('show');
    if(replyText) replyText.textContent=text;
    semiDiLuce+=reward; updateSemi();
    showToast(`+${reward} Semi di Luce! 🌱`);
    btn.textContent='✓ Risposta inviata!';
    if(input) input.disabled=true;
    const rd=document.createElement('div'); rd.className='wisdom-reward';
    rd.textContent=`+${reward} Semi guadagnati! 🌱`; replyBox.appendChild(rd);
  } catch(e) {
    if(loading) loading.classList.remove('show');
    ws.replied=true; ws.civettaText='Riflessione preziosa. Ogni genitore che si interroga su questi temi sta già facendo la cosa più importante per i propri figli. 🦉';
    ws.rewardGiven=true;
    if(replyBox) replyBox.classList.add('show');
    if(replyText) replyText.textContent=ws.civettaText;
    semiDiLuce+=reward; updateSemi();
    btn.textContent='✓ Risposta inviata!';
    if(input) input.disabled=true;
  }
}
