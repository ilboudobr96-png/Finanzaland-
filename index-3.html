<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"/>
<title>FinanzaLand</title>
<script>
// Cerca automaticamente il file FinanzaLand nel repository
const possibili = [
  'FinanzaLand_v19_DEFINITIVA_FINALE.html',
  'FinanzaLand_v19_DEFINITIVA_FINALE-1.html', 
  'FinanzaLand_v19_DEFINITIVA_FINALE-2.html',
  'FinanzaLand_v19_.html',
  'FinanzaLand_PWA.html',
];

async function trovaPagina() {
  for (const nome of possibili) {
    try {
      const r = await fetch(nome, {method:'HEAD'});
      if (r.ok) {
        window.location.replace(nome);
        return;
      }
    } catch(e) {}
  }
  document.getElementById('msg').innerHTML = 'File non trovato. Contatta Bernard Ilboudo.';
}

trovaPagina();
</script>
</head>
<body style="background:#000;display:flex;align-items:center;justify-content:center;height:100vh;flex-direction:column;font-family:sans-serif">
<div style="font-size:3rem">🐉</div>
<div style="color:#FFD700;font-size:1rem;margin-top:10px">FinanzaLand — Caricamento...</div>
<div id="msg" style="color:#666;font-size:.8rem;margin-top:8px"></div>
</body>
</html>
